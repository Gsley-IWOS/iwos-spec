# Illustrative. Minimal valid AI bootstrap manifest: four contract-mandatory documents, thirteen steps, twelve-level authority chain.
schema_version: "1.0.0"
document:
  id: AIO-003
  title: Example AI Bootstrap
  purpose: Demonstrate the minimal valid manifest.
  version: "1.0.0"
  status: Draft
  authority: engineering-charter/05_AI_AGENT_CONTRACT.yaml
  parent_document: engineering-charter/05_AI_AGENT_CONTRACT.yaml
  last_updated: "2026-10-31"
repository:
  organisation: Example-Org
  name: iwos-spec
  role: constitutional-specification-repository
  implementation_repository: IWOS
  default_branch: main
  implementation_code_expected: false
  architecture_changes_allowed_without_governance: false
contract_mandatory_reading:
  - { path: engineering-charter/00_FOUNDING_CHARTER.md, reason: Mission. }
  - { path: engineering-charter/01_PROJECT_GENESIS.md, reason: Programme. }
  - { path: engineering-charter/02_ARCHITECTURE_BASELINE.md, reason: Architecture. }
  - { path: engineering-charter/06_ENGINEERING_CONSTITUTION.md, reason: Law. }
repository_onboarding_reading:
  - { path: README.md, reason: Entry point. }
execution_sequence:
  - { step: 1, action: Load Mission, evidence: Read. }
  - { step: 2, action: Verify Constitution, evidence: Lock matches. }
  - { step: 3, action: Load Architecture Baseline, evidence: Read. }
  - { step: 4, action: Verify Engineering State, evidence: Read. }
  - { step: 5, action: Load Current Task, evidence: Cited. }
  - { step: 6, action: Validate Dependencies, evidence: Checks pass. }
  - { step: 7, action: Produce Design, evidence: Plan recorded. }
  - { step: 8, action: Implement, evidence: Diff matches plan. }
  - { step: 9, action: Execute Tests, evidence: Output recorded. }
  - { step: 10, action: Perform Self Review, evidence: Gates assessed. }
  - { step: 11, action: Update Documentation, evidence: Documents updated. }
  - { step: 12, action: Update Engineering Memory, evidence: Memory updated. }
  - { step: 13, action: Produce Handoff, evidence: Sections present. }
protected_documents:
  lock_file: .ai/CONSTITUTION_LOCK.yaml
  change_authority: Accepted proposal and human maintainer.
  path_patterns: ["engineering-charter/*"]
engineering_memory:
  changelog: CHANGELOG.md
  current_state: .ai/CURRENT_STATE.md
  next_task: .ai/NEXT_TASK.md
  engineering_state: .ai/ENGINEERING_STATE.yaml
  knowledge_graph: .ai/KNOWLEDGE_GRAPH.yaml
  decision_graph: .ai/DECISION_GRAPH.yaml
  manifest: .ai/MANIFEST.yaml
validation:
  commands: [make validate]
  requirements: [Python 3.11 or later]
  continuous_integration: .github/workflows/validate.yml
handoff:
  template: .github/pull_request_template.md
  mandatory_sections: [Summary, Files Changed, Decisions, Validation, Risks, Outstanding Work, Recommended Next Task]
authority_chain: [a, b, c, d, e, f, g, h, i, j, k, l]
prohibited_actions_source: engineering-charter/05_AI_AGENT_CONTRACT.yaml
ratification:
  status: Draft
  effective_on: Merge to main.
  amendment_authority: engineering-charter/06_ENGINEERING_CONSTITUTION.md
