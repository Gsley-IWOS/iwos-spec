      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0005
      title: Remove the empty, misnamed bootstrap file
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0006
      title: Exempt the legacy EWP-0001 format from structural checks
