    - id: DEC-0009
      title: ADR-0004 held open pending the decision on a dedicated repository
      status: proposed
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0001
      title: Build-out incorporates drafts from pull requests 2, 3 and 4 and rejects pull request 1
      status: accepted
