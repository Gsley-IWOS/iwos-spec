state:
  current_release:
    version: "1.0.0"
    name: Genesis
    status: in-preparation
    description: First ratified release of the constitutional repository. Tagged when milestones M0 and M1 are complete.
  current_milestone:
    id: M2
    name: Specification (governance layer first, per AIP-0002)
    status: in-progress
  current_sprint:
    number: 4
    name: Gate hardening, learning loop and incident handling
    status: in-progress
  current_epic:
    id: EPIC-0001
    name: Constitutional repository build-out
    status: in-progress
  current_story:
    id: STORY-0004
    name: Gate hardening (base constitution, control files), learning loop, incident ledger and security policy
    work_package: EWP-0006
    status: complete
  current_task:
    id: TASK-0004-01
    name: Owner creates the iwos-guard repository so the toolchain can move and be tagged (ADR-0006)
    status: awaiting-review
  current_risks:
    - id: RISK-0001
      severity: medium
      description: EWP-0002 and EWP-0003 were authored as Proposed work packages by an AI agent to give the build-out traceability. Their scope has not yet been approved by a human maintainer. ADR-0001 to ADR-0003 are Proposed and AIP-0001 is in Review for the same reason.
      mitigation: Maintainer reviews both packages and either sets status Approved or amends scope before merge.
      status: closed
    - id: RISK-0002
      severity: medium
      description: AIP-0001 proposes new identifier families used by documents in this repository. Until it is accepted the identifiers outside the constitutional families are provisional.
      mitigation: Accept, amend or reject AIP-0001 at review; if rejected, re-identify the affected documents under the Naming Standard families.
      status: closed
    - id: RISK-0003
      severity: low
      description: Open pull requests 1 to 4 on the repository overlap with this build-out. Pull request 1 rewrites ratified constitutional documents and must not be merged.
      mitigation: Close pull requests 1 to 4 as superseded after this build-out is merged.
      status: open
    - id: RISK-0004
      severity: low
      description: .github/CODEOWNERS names the repository owner for every protected path, but a single owner cannot review their own change and branch protection does not yet require the gate or code-owner review.
      mitigation: Owner enables branch protection on main (require the validate and IWOS Guard checks and code-owner review) and names a second Maintainer; the interim self-approval rule applies until then.
      status: open
    - id: RISK-0005
      severity: medium
      description: The strategic pivot to the governance layer is accepted by the repository owner but AIP-0002 is in Review. Until it is accepted, Project Genesis still sequences M2 around the Intelligent Work Language, and SPEC-ENGGOV-001 is a Draft without authority.
      mitigation: Constitutional Authority decides AIP-0002; on acceptance applies its Specification to Project Genesis and regenerates the lock.
      status: closed
    - id: RISK-0006
      severity: medium
      description: IWOS Guard competes for attention with GitHub Spec Kit and AGENTS.md conventions that have large existing adoption. Differentiation rests on enforcement, the lock, the gate and the authority interface, which are easy to imitate.
      mitigation: Ship early, publish the specification as an open standard, and build rule packs and a hosted portal that accumulate value.
      status: open
    - id: RISK-0007
      severity: medium
      description: Agent attribution rests on disclosure. The agent in pull request 1 committed under the owner's identity; had it disclosed nothing, the report would have named no agent.
      mitigation: ADR-0005 makes the report state its evidence and its limits; blocking rules never depend on attribution. Revisit when a cross-provider agent identity standard exists.
      status: open
    - id: RISK-0008
      severity: high
      description: Until toolchain version 0.2.0 the gate read the constitution from the head of the change it judged, so one change could remove a protected pattern, rewrite the file and regenerate the lock, and pass. Reproduced on 2026-11-14. No change in this repository's history used the path.
      mitigation: ADR-0007. The gate judges against the constitution of the base revision, control files need a proposal citation whatever the constitution says, and the reproduction is a regression test.
      status: closed
    - id: RISK-0009
      severity: medium
      description: A pull request can edit the workflow that runs the gate so that the gate never runs, and the gate checks that a citation is present, not that the cited proposal was accepted. Neither can be closed from inside the toolchain.
      mitigation: The gate warns when its automation changes (ADR-0007). Owner requires both checks by name in branch protection and keeps .github/ under code-owner review; reviewers confirm cited proposals.
      status: open
    - id: RISK-0010
      severity: medium
      description: ADR-0006 moves IWOS Guard to a dedicated repository, but the repository does not exist yet and the published address is still this repository. Consumers who reference a branch here will break at the move.
      mitigation: Documentation asks consumers to pin a commit. Owner creates Gsley-IWOS/iwos-guard; the toolchain moves and is tagged there, and this repository pins the release.
      status: open
  current_decisions:
    - id: ADR-0001
      title: Record architecture decisions as ADRs in adr/
      status: Accepted
      record: adr/ADR-0001-architecture-decision-records.md
    - id: ADR-0002
