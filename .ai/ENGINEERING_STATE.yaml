      status: Accepted
      record: adr/ADR-0003-machine-readable-engineering-memory.md
    - id: ADR-0004
      title: Distribute the governance toolchain from tools/ until a dedicated repository exists
      status: Superseded
      record: adr/ADR-0004-governance-toolchain-distribution.md
    - id: ADR-0005
      title: Agent attribution rests on disclosure, and reports print no addresses
      status: Accepted
      record: adr/ADR-0005-agent-attribution-by-disclosure.md
    - id: ADR-0006
      title: IWOS Guard is developed and released from a dedicated repository
      status: Accepted
      record: adr/ADR-0006-iwos-guard-dedicated-repository.md
    - id: ADR-0007
      title: The gate judges a change against the constitution of its base
      status: Accepted
      record: adr/ADR-0007-gate-judges-against-base-constitution.md
    - id: ADR-0008
      title: Learning from gate history and recording incidents, without telemetry
      status: Accepted
      record: adr/ADR-0008-learning-loop-and-incident-ledger.md
    - id: DEC-0007
      title: Strategic pivot to the governance layer, formalised through AIP-0002
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0008
      title: The product is named IWOS Guard
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0009
      title: ADR-0004 held open pending the decision on a dedicated repository
      status: superseded
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0010
      title: Implement the review of 2026-11-14 in this repository; the move to iwos-guard waits on the owner creating it
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0001
      title: Build-out incorporates drafts from pull requests 2, 3 and 4 and rejects pull request 1
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0002
      title: Ratification is merge to main by an authorised human maintainer
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0003
      title: Provisional identifier families pending AIP-0001
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0004
      title: EWP-0002 and EWP-0003 authored as Proposed work packages
      status: accepted
      record: .ai/DECISION_GRAPH.yaml
    - id: DEC-0005
      title: Remove the empty, misnamed bootstrap file
      status: accepted
