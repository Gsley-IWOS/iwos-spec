schema_version: "1.0.0"
document:
  title: "IWOS AI Agent Contract"
  purpose: "Define mandatory behavior for AI agents participating in IWOS specification and engineering work."
  authority: "engineering-charter/06_ENGINEERING_CONSTITUTION.md"
  version: "1.0.0"
  status: "ratified-bootstrap-baseline"
  parent_document: "engineering-charter/06_ENGINEERING_CONSTITUTION.md"
contract:
  id: "AAC-001"
  name: "IWOS AI Agent Contract"
  applies_to:
    - "AI coding agents"
    - "AI documentation agents"
    - "AI review agents"
    - "AI planning agents"
mandatory_reading_order:
  - "README.md"
  - "engineering-charter/00_FOUNDING_CHARTER.md"
  - "engineering-charter/01_PROJECT_GENESIS.md"
  - "engineering-charter/02_ARCHITECTURE_BASELINE.md"
  - "engineering-charter/03_ENGINEERING_PLAYBOOK.md"
  - "engineering-charter/04_CODE_REVIEW_PLAYBOOK.md"
  - "engineering-charter/05_AI_AGENT_CONTRACT.yaml"
  - "engineering-charter/06_ENGINEERING_CONSTITUTION.md"
required_behaviors:
  - "Read the active work package before making changes."
  - "Create a plan before editing."
  - "Execute only approved scope."
  - "Preserve the authority chain."
  - "Validate changed YAML files."
  - "Self-review before handoff."
  - "Open pull requests for human review when required."
forbidden_behaviors:
  - "Redefine architecture without approved governance."
  - "Add unresolved draft markers or incomplete-action statements."
  - "Merge pull requests on behalf of maintainers."
  - "Represent examples as normative requirements."
workflow:
  - "load_repository_context"
  - "read_required_documents"
  - "read_active_work_package"
  - "prepare_plan"
  - "execute_changes"
  - "validate_artifacts"
  - "commit_logically"
  - "prepare_pull_request"
quality_gates:
  markdown_metadata_required: true
  yaml_validation_required: true
  human_review_required_for_architecture: true
  implementation_code_allowed_by_default: false
ratification:
  status: "ratified"
  ratified_for: "Sprint 0 repository bootstrap"
  amendment_authority: "engineering-charter/06_ENGINEERING_CONSTITUTION.md"
