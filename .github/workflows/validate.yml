# Continuous integration for the IWOS specification repository.
# Runs the repository validator and its unit tests on every pull request and push to main.
# Authority: ADR-0002. Permissions are read-only as the Security Standard requires.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Structural, schema, consistency, example and integrity checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Run repository validator
        run: make validate

      - name: Run validator unit tests
        run: make test-validator

      - name: Run IWOS Guard unit tests
        run: make test-iwos

      - name: Verify the repository against its own constitution
        run: make guard

      - name: Gate the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PYTHONPATH: tools/iwos/src
        run: python -m iwos.cli gate --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --body-env PR_BODY --format both --output iwos-gate-report.md --summary
